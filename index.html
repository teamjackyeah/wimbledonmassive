<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Wimbledon Massive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one framed game screen showing the common, title painted into the sky, a short caption beneath. Deliberately single-theme daytime scene. */
:root{
  --ground:#24452a;
  --frame:#162418;
  --cream:#f4ecd2;
  --muted:#b9c9a8;
  --pixel:"Press Start 2P", "Courier New", monospace;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:var(--ground);color:var(--cream);
  font-family:var(--pixel);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px;
  box-sizing:border-box;
}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.screen{
  position:relative;width:100%;
  height:clamp(340px, 72vh, 620px);
  border:4px solid var(--frame);
  box-shadow:0 0 0 4px #3c6b40, 0 8px 0 4px var(--frame);
  overflow:hidden;background:#7cc3ee;
}
.screen,.screen *{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:manipulation;outline:none}
canvas.over{cursor:pointer}
.title{
  position:absolute;top:14px;left:16px;margin:0;pointer-events:none;
  font-size:clamp(14px, 3.2vw, 30px);line-height:1.35;letter-spacing:.04em;
  color:#fffbe8;text-shadow:3px 3px 0 #26324a, -1px -1px 0 #26324a, 1px -1px 0 #26324a, -1px 1px 0 #26324a;
}
.title span{display:block}
.sub{
  position:absolute;left:16px;top:calc(14px + clamp(14px, 3.2vw, 30px) * 2.9);
  margin:0;font-size:clamp(8px, 1.2vw, 11px);color:#26324a;pointer-events:none;
}
.caption{margin:0;font-size:10px;line-height:1.9;color:var(--muted);text-align:center}
.invite{margin:6px auto 0;max-width:640px;padding:16px 18px;border:4px solid var(--frame);background:#2f5a36;box-shadow:0 0 0 4px #3c6b40;text-align:center;display:grid;gap:10px}
.invite-big{margin:0;font-size:clamp(12px,2.4vw,18px);line-height:1.6;color:var(--cream);text-wrap:balance}
.invite-big b{color:#f6d34a;font-weight:400}
.invite-small{margin:0;font-size:clamp(9px,1.4vw,11px);line-height:2;color:var(--muted);text-wrap:balance}
@media (min-width:700px){.title span{display:inline}.sub{top:calc(14px + clamp(14px,3.2vw,30px) * 1.7)}}
</style>

<div class="wrap">
  <div class="screen" id="screen">
    <canvas id="c" aria-label="An 8-bit scene of Wimbledon Common with the windmill, where the Wimbledon Massive characters walk around and say hello to each other"></canvas>
    <h1 class="title"><span>Wimbledon</span> <span>Massive</span></h1>
    <p class="sub">Wimbledon Common, SW19</p>
  </div>
  <p class="caption">Tap someone to visit their page</p>
  <div class="invite">
    <p class="invite-big">We need <b>YOU</b> on Wimbledon Common.</p>
    <p class="invite-small">WhatsApp Jack a photo you like of yourself and you'll appear here!</p>
  </div>
</div>

<script>
(function(){
const screen=document.getElementById('screen');
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- sprites: 12 x 13 body + 4 legs ---------- */
const BODY={
 jack:[
 "...KKKKKK...","..KHHHHhHK..",".KHHhHHHHHK.",".KSSSSSSSSK.",
 ".KKKKSSKKKK.",".KKWKSSKWKK.",".KSSSSSSSSK.",".KSSSWWSSSK.",
 "..KKSSSSKK..",".KTTLTTLTTK.","KTTTLTTLTTTK","KSTTTLLTTTSK","KSKTTTTTTKSK"],
 ellie:[
 "...KKKKKK...","..KHHHHHHK..",".KHHHhHHHHK.",".KHHSSSSHHK.",
 ".KHSSSSSSHK.",".KHSKSSKSHK.",".KHSSSSSSHK.",".KHSSWWSSHK.",
 "KHHKSSSSKHHK","KHHTTTTTTHHK","KHTTTTTTTTHK","KSTTTTTTTTSK","KSKTTTTTTKSK"],
 gen:[
 "...KKKKKK...","..KHHHHHHK..",".KHHHHhHHHK.",".KSSSSSSSSK.",
 ".KSSSSSSSSK.",".KSKSSSSKSK.",".KSSSSSSSSK.",".KSSSWWSSSK.",
 "..KKSSSSKK..",".KTTTTTTTTK.","KTTTTTTTTTTK","KSTTTTTTTTSK","KSKTTTTTTKSK"]
};
const LEGS=[
 ["..KPPPPPPK..","..KPPKKPPK..","..KPPKKPPK..","..KOOKKOOK.."],
 ["..KPPPPPPK..",".KPPK.KPPK..",".KPPK..KPPK.",".KOOK..KOOK."]
];
const base={K:'#151515',W:'#ffffff',O:'#3a2a1a'};
const CHARS=[
 {name:'Jack', rows:BODY.jack, pal:{...base,H:'#9a9a9a',h:'#6b6b6b',S:'#f2c4a0',T:'#bcd4ee',L:'#1f8a42',P:'#2b3550'}},
 {name:'Ellie',rows:BODY.ellie,pal:{...base,H:'#6b4a33',h:'#4a3222',S:'#f4c9ae',T:'#5a6a3a',P:'#2b2b35'}}
];

/* ---------- seasons and birthdays ---------- */
// Birthdays as 'MM-DD', e.g. Jack:'03-14'
const BIRTHDAYS={Jack:null,Ellie:null};
const SKY_DAY=['#5aa3e6','#68afeb','#78bcf0','#8bc9f3','#a2d6f5','#bce3f6'];
const GREEN_FAR=['#4a7f55','#5f9466','#76a97a'],GREEN_NEAR=['#24552d','#2f6b3a','#3f8248'];
const AUT_FAR=[['#a5642c','#c97d33','#e0a24a'],['#8f4a24','#b25a2b','#d07a3a'],GREEN_FAR];
const AUT_NEAR=[['#7a3f1d','#a8532a','#c96e2e'],['#8a2f1c','#b23f25','#d0602f'],['#7d6a1c','#a8902a','#cdb23e'],GREEN_NEAR];
const LEAVES={n:16,cols:['#d9752b','#c2491f','#e8a53a'],vy:[5,9],sway:5};
const THEMES={
 summer:{sky:SKY_DAY,cloud:['#ffffff','#d6ecf8'],far:[GREEN_FAR],near:[GREEN_NEAR],grass:['#62b04c','#529c40','#7cc65d'],path:['#a8854f','#cfae74','#bb9a62'],flowers:['#ffffff','#f6d34a','#f28fb1'],flowerN:0.35},
 spring:{sky:SKY_DAY,cloud:['#ffffff','#d6ecf8'],far:[GREEN_FAR,['#c98aa3','#dfa3bb','#f0c3d4']],near:[GREEN_NEAR,['#c76f92','#e48fb0','#f6bfd3'],GREEN_NEAR],grass:['#68b850','#57a443','#86cd63'],path:['#a8854f','#cfae74','#bb9a62'],flowers:['#ffffff','#f6d34a','#f28fb1','#a98be0'],flowerN:0.6,particles:{n:14,cols:['#f6bfd3','#ffffff'],vy:[4,8],sway:6}},
 autumn:{sky:SKY_DAY,cloud:['#ffffff','#d6ecf8'],far:AUT_FAR,near:AUT_NEAR,grass:['#79a846','#68953b','#92bb57'],path:['#a8854f','#cfae74','#bb9a62'],flowers:['#e0a24a','#c2491f'],flowerN:0.15,particles:LEAVES},
 halloween:{sky:['#3b3f7a','#56518f','#7c5c99','#b06f8c','#dd8f6e','#f2b871'],cloud:['#f1cdb8','#cf9b8d'],far:AUT_FAR,near:AUT_NEAR,grass:['#6f9a42','#5f8838','#87ad52'],path:['#9c7a4a','#c09f6b','#ad8d5b'],flowers:[],flowerN:0,particles:LEAVES,pumpkins:true,bats:true},
 winter:{sky:['#6f9cc8','#7ea9d0','#8fb6d8','#a2c3df','#b7d1e6','#cbdfee'],cloud:['#ffffff','#dbe6ef'],far:[['#6f8a84','#82a098','#9cb7ae']],near:[['#1f4a2c','#2a5d38','#36704a']],grass:['#eef3f7','#dbe4ec','#ffffff'],path:['#9d958a','#bdb5aa','#aca498'],flowers:[],flowerN:0,snow:true,particles:{n:70,cols:['#ffffff'],vy:[9,17],sway:3}}
};
THEMES.christmas={...THEMES.winter,santa:true};
let T,season,bday=[];
function todayKey(d){return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pickTheme(){
  const h=decodeURIComponent((location.hash||'').slice(1)).toLowerCase();
  const d=new Date(),m=d.getMonth()+1,day=d.getDate();
  season=THEMES[h]?h:(m===12||(m===1&&day===1))?'christmas':m<=2?'winter':m<=5?'spring':m<=8?'summer':(m===10&&day>=18)?'halloween':'autumn';
  T=THEMES[season];
  if(h.startsWith('birthday-')){const c=CHARS.find(c=>c.name&&c.name.toLowerCase()===h.slice(9));bday=c?[c.name]:[]}
  else{const k=todayKey(d);bday=Object.keys(BIRTHDAYS).filter(n=>BIRTHDAYS[n]===k)}
  document.querySelector('.title').innerHTML=bday.length?`<span>Happy Birthday</span> <span>${bday.join(' &amp; ')}</span>`:'<span>Wimbledon</span> <span>Massive</span>';
}
pickTheme();

/* ---------- helpers ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let u=1,LW=0,LH=0,W=0,H=0,horizon=0,wx=0,wbase=0,skyLayer,landLayer,clouds=[];
function px(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.floor(x*u),Math.floor(y*u),Math.ceil(w*u),Math.ceil(h*u))}
function makeLayer(){const c=document.createElement('canvas');c.width=W;c.height=H;return c}

/* ---------- static layers ---------- */
function buildLayers(){
  const r=rng(19);
  skyLayer=makeLayer();const s=skyLayer.getContext('2d');
  const bh=Math.ceil(horizon/T.sky.length);
  T.sky.forEach((col,i)=>px(s,0,i*bh,LW,bh+1,col));

  landLayer=makeLayer();const g=landLayer.getContext('2d');
  // tree line: two rows of round-canopy pixel trees
  function tree(cx,cy,rad,pal){
    const [dark,mid,light]=pal;
    px(g,cx,cy,1,horizon-cy,'#5a3f28');
    for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){
      const d=dx*dx+dy*dy;
      if(d>rad*rad+(r()-0.5)*rad*1.6)continue;
      let col=mid;
      if(dx+dy<-rad*0.5)col=light; else if(dx+dy>rad*0.6)col=dark;
      if(r()<0.06)col=dark;
      if(T.snow&&dy<-rad*0.3&&r()<0.85)col='#f4f8fb';
      px(g,cx+dx,cy+dy,1,1,col);
    }
  }
  for(let x=-4;x<LW+8;x+=7+Math.floor(r()*5)){
    const rad=6+Math.floor(r()*4);
    tree(x,horizon-5-Math.floor(rad*0.6),rad,T.far[Math.floor(r()*T.far.length)]);
  }
  for(let x=-2;x<LW+8;x+=6+Math.floor(r()*5)){
    const rad=4+Math.floor(r()*3);
    tree(x,horizon-2-Math.floor(rad*0.5),rad,T.near[Math.floor(r()*T.near.length)]);
  }
  // grass
  px(g,0,horizon,LW,LH-horizon,T.grass[0]);
  for(let y=horizon;y<LH;y+=4)for(let x=(y/4%2)*3;x<LW;x+=6){ if(r()<0.5)px(g,x,y,1,2,T.grass[1]); }
  for(let i=0;i<LW*LH*0.012;i++){px(g,Math.floor(r()*LW),horizon+2+Math.floor(r()*(LH-horizon)),1,1,T.grass[2])}
  // path from bottom-left up to the windmill
  const top=wbase+1;
  for(let y=top;y<LH;y++){
    const t=(y-top)/(LH-top);
    const cx=wx+(LW*0.28-wx)*t*t*(3-2*t);
    const half=2+t*14;
    px(g,cx-half-1,y,1,1,T.path[0]);
    px(g,cx-half,y,half*2,1,T.path[1]);
    px(g,cx+half,y,1,1,T.path[0]);
    if(r()<0.5)px(g,cx-half+r()*half*2,y,1,1,T.path[2]);
  }
  // flowers
  const fl=T.flowers;
  if(fl.length)for(let i=0;i<LW*T.flowerN;i++){
    const x=Math.floor(r()*LW),y=horizon+6+Math.floor(r()*(LH-horizon-6));
    px(g,x,y,1,1,fl[i%fl.length]);px(g,x,y+1,1,1,'#3f8a33');
  }
  // pumpkins
  if(T.pumpkins){
    const pumpkin=(x,y,lit)=>{
      px(g,x+1,y,3,1,'#e8771f');px(g,x,y+1,5,2,'#e8771f');px(g,x+1,y+3,3,1,'#c45f15');px(g,x+2,y-1,1,1,'#3f7a2a');
      if(lit){px(g,x+1,y+1,1,1,'#ffd34a');px(g,x+3,y+1,1,1,'#ffd34a');px(g,x+1,y+2,3,1,'#ffd34a')}
      else px(g,x+2,y+1,1,2,'#c45f15');
    };
    const n=Math.max(7,Math.round(LW/14));
    for(let i=0,tries=0;i<n&&tries<200;tries++){
      const x=Math.round(r()*(LW-6)),y=Math.round(horizon+1+r()*(wbase+15-horizon));
      if(Math.abs(x-wx)<26&&y<wbase+4)continue;
      pumpkin(x,y,r()<0.5);i++;
    }
  }
}

/* ---------- windmill silhouette ---------- */
let sailA=Math.PI/4;
/* Wimbledon Windmill: brick roundhouse, white gallery rail, dark tapered tower, white boat-shaped cap, four white lattice sails */
function drawMill(){
  // hedges either side
  px(ctx,wx-44,wbase-6,22,7,'#1f4a28');px(ctx,wx-44,wbase-7,22,1,'#2a5c33');
  px(ctx,wx+22,wbase-6,22,7,'#1f4a28');px(ctx,wx+22,wbase-7,22,1,'#2a5c33');
  if(T.snow){px(ctx,wx-44,wbase-7,22,2,'#f4f8fb');px(ctx,wx+22,wbase-7,22,2,'#f4f8fb')}
  // brick roundhouse
  const rb=wbase,rw=40,rx=wx-20;
  px(ctx,rx,rb-12,rw,13,'#4a3b33');
  for(let y=rb-11;y<=rb;y+=3)px(ctx,rx,y,rw,1,'#3e312a');
  px(ctx,rx,rb-12,rw,1,'#e9e7df'); // white ledge
  px(ctx,wx-2,rb-5,4,6,'#2a221d');px(ctx,wx-1,rb-6,2,1,'#2a221d'); // door
  [[-15,-9],[-8,-9],[6,-9],[13,-9]].forEach(([dx,dy])=>{px(ctx,wx+dx,rb+dy,2,3,'#e9e7df');px(ctx,wx+dx,rb+dy+1,2,1,'#6d7480')});
  // dark tapered tower
  const tb=rb-13,th=22;
  for(let r=0;r<th;r++){const w=Math.round(18-8*r/(th-1));const x0=wx-Math.floor(w/2);px(ctx,x0,tb-r,w,1,'#1f2433');px(ctx,x0+w-2,tb-r,1,1,'#2e3548')}
  // white gallery rail with X pattern
  const gy=rb-13;
  px(ctx,rx-1,gy-4,rw+2,1,'#f2f1ec');px(ctx,rx-1,gy,rw+2,1,'#f2f1ec');
  for(let x=0;x<=rw;x+=4){px(ctx,rx+x,gy-3,1,3,'#f2f1ec');px(ctx,rx+x+1,gy-3,1,1,'#f2f1ec');px(ctx,rx+x+2,gy-2,1,1,'#f2f1ec');px(ctx,rx+x+3,gy-1,1,1,'#f2f1ec');px(ctx,rx+x+3,gy-3,1,1,'#f2f1ec');px(ctx,rx+x+1,gy-1,1,1,'#f2f1ec')}
  // white weatherboarded cap
  const cb=tb-th;
  [12,12,12,12,11,10,8,6].forEach((w,i)=>{px(ctx,wx-w/2,cb-i,w,1,i%2?'#e9e9e3':'#d3d3cc')});
  if(T.snow)px(ctx,wx-3,cb-8,6,1,'#ffffff');
  // sails
  const hx=wx,hy=cb-4,L=Math.max(14,Math.min(28,hy-3));
  for(let k=0;k<4;k++){
    const a=sailA+k*Math.PI/2,dx=Math.cos(a),dy=Math.sin(a),nx=-dy,ny=dx;
    for(let t=0;t<=L;t++){
      if(t>=4)for(let s=1;s<=4;s++){
        if(t%2===0||s===4||t===4||t===L)px(ctx,Math.round(hx+dx*t+nx*s),Math.round(hy+dy*t+ny*s),1,1,'#fbfbf8');
      }
      px(ctx,Math.round(hx+dx*t),Math.round(hy+dy*t),1,1,'#bfc3c8');
    }
  }
  px(ctx,hx-1,hy-1,3,3,'#1f2433');
}

/* ---------- clouds ---------- */
function drawCloud(c){
  px(ctx,c.x+3,c.y-3,c.w-8,3,T.cloud[0]);
  px(ctx,c.x+c.w*0.45,c.y-5,c.w*0.3,2,T.cloud[0]);
  px(ctx,c.x,c.y,c.w,4,T.cloud[0]);
  px(ctx,c.x+1,c.y+4,c.w-2,1,T.cloud[1]);
}

/* ---------- seasonal effects ---------- */
let parts=[],bats=[],santa={x:-60,wait:2};
function initFx(){
  const sets=[];if(T.particles)sets.push(T.particles);
  if(bday.length)sets.push({n:24,cols:['#e84a8a','#f6d34a','#4ab0e8','#7bd36a','#ffffff'],vy:[6,12],sway:4});
  parts=[];sets.forEach(s=>{for(let i=0;i<s.n;i++)parts.push({x:Math.random()*LW,y:Math.random()*LH,vy:rand(s.vy[0],s.vy[1]),sway:s.sway,ph:Math.random()*6.28,col:s.cols[i%s.cols.length]})});
  bats=T.bats?Array.from({length:3},()=>({x:Math.random()*LW,y:8+Math.random()*horizon*0.4,s:rand(10,18),ph:Math.random()*6})):[];
  santa={x:-60,wait:2};
}
function updateFx(dt){
  if(reduced)return;
  parts.forEach(p=>{p.y+=p.vy*dt;p.ph+=dt*1.5;if(p.y>LH){p.y=-2;p.x=Math.random()*LW}});
  bats.forEach(b=>{b.x+=b.s*dt;b.ph+=dt*10;if(b.x>LW+6){b.x=-6;b.y=8+Math.random()*horizon*0.4}});
  if(T.santa){if(santa.wait>0)santa.wait-=dt;else{santa.x+=20*dt;if(santa.x>LW+10){santa.x=-60;santa.wait=10}}}
}
function drawBat(b){
  const x=Math.round(b.x),y=Math.round(b.y+Math.sin(b.ph*0.3)*2),c='#1b1426';
  px(ctx,x-1,y,3,1,c);
  if(Math.sin(b.ph)>0){px(ctx,x-3,y-1,2,1,c);px(ctx,x+2,y-1,2,1,c)}
  else{px(ctx,x-3,y+1,2,1,c);px(ctx,x+2,y+1,2,1,c)}
}
function drawSanta(){
  if(!T.santa)return;
  const sx=Math.round(reduced?LW*0.3:santa.x),sy=Math.round(horizon*0.22+Math.sin(sx*0.08)*2)+6;
  px(ctx,sx+10,sy-2,24,1,'#c9a24e');
  const deer=(rx,ry,red)=>{const b='#8a5a34',a='#5a3a1f';px(ctx,rx,ry,6,2,b);px(ctx,rx+5,ry-2,2,2,b);px(ctx,rx+7,ry-1,1,1,red?'#e03a2e':b);px(ctx,rx+5,ry-4,1,2,a);px(ctx,rx+4,ry-4,1,1,a);px(ctx,rx+6,ry-5,1,1,a);px(ctx,rx+1,ry+2,1,2,'#6b4428');px(ctx,rx+4,ry+2,1,2,'#6b4428');px(ctx,rx-1,ry,1,1,'#f2f2ee')};
  deer(sx+16,sy-3,false);deer(sx+27,sy-3,true);
  px(ctx,sx,sy-5,3,3,'#8a6a3a');
  px(ctx,sx+3,sy-5,5,3,'#d8352c');px(ctx,sx+5,sy-7,2,2,'#f2c4a0');px(ctx,sx+5,sy-6,2,1,'#ffffff');px(ctx,sx+4,sy-8,3,1,'#d8352c');px(ctx,sx+3,sy-9,1,1,'#ffffff');
  px(ctx,sx,sy-2,11,3,'#c8312a');px(ctx,sx+9,sy-4,2,2,'#c8312a');
  px(ctx,sx-1,sy+2,13,1,'#d8b04a');px(ctx,sx+11,sy+1,1,1,'#d8b04a');
}
function drawParts(){parts.forEach(p=>px(ctx,Math.round(p.x+Math.sin(p.ph)*p.sway*0.3),Math.round(p.y),1,1,p.col))}

/* ---------- characters ---------- */
let people=[];
function rand(a,b){return a+Math.random()*(b-a)}
function walkBox(){return{x0:10,x1:LW-10,y0:wbase+20,y1:LH-6}}
function newTarget(p){const b=walkBox();p.tx=rand(b.x0,b.x1);p.ty=rand(b.y0,b.y1);p.state='walk'}
function spawn(){
  const b=walkBox();
  people=CHARS.map((c,i)=>({...c,x:rand(b.x0,b.x1),y:rand(b.y0,b.y1),tx:0,ty:0,state:'idle',wait:rand(0.2,2),flip:Math.random()<.5,anim:0,say:null,sayT:0,chat:null}));
  // put Jack and Ellie near each other so they greet early
  people[0].x=LW*0.35;people[0].y=b.y0+(b.y1-b.y0)*0.55;
  people[1].x=LW*0.35+30;people[1].y=people[0].y+2;
  people[0].state='walk';people[0].tx=people[1].x-14;people[0].ty=people[1].y;
}
const cooldown=new Map();
function greetLine(to){if(to.name&&bday.includes(to.name))return `Happy birthday ${to.name}!`;return to.name?`Hello ${to.name}!`:'Hello!'}

function startChat(a,b){
  a.state=b.state='chat';
  a.flip=b.x<a.x;b.flip=a.x<b.x;
  const chat={a,b,t:0};a.chat=b.chat=chat;
}
function updateChat(chat,dt){
  chat.t+=dt;const {a,b,t}=chat;
  a.say=t<1.8?greetLine(b):null;
  b.say=t>=1.8&&t<3.6?greetLine(a):null;
  if(t>=3.6){
    a.chat=b.chat=null;a.say=b.say=null;
    [a,b].forEach(p=>{p.state='idle';p.wait=rand(0.4,1.5)});
    cooldown.set(a.name+b.name+people.indexOf(a)+'-'+people.indexOf(b),performance.now()+12000);
  }
}

let checkT=0;
function update(dt){
  updateFx(dt);
  if(!reduced){
    sailA+=dt*0.35;
    clouds.forEach(c=>{c.x+=c.s*dt;if(c.x>LW+4)c.x=-c.w-4});
  }
  const speed=reduced?7:14;
  const chats=new Set();
  people.forEach(p=>{
    if(p.chat){chats.add(p.chat);return}
    if(p.sayT>0){p.sayT-=dt;if(p.sayT<=0)p.say=null;}
    if(p.state==='idle'){p.wait-=dt;if(p.wait<=0)newTarget(p)}
    else if(p.state==='walk'){
      const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
      if(d<1){p.state='idle';p.wait=rand(1,3.5)}
      else{p.x+=dx/d*speed*dt;p.y+=dy/d*speed*dt;p.flip=dx<0;p.anim+=dt}
    }
  });
  chats.forEach(c=>updateChat(c,dt));
  checkT-=dt;
  if(checkT<=0){
    checkT=0.3;const now=performance.now();
    for(let i=0;i<people.length;i++)for(let j=i+1;j<people.length;j++){
      const a=people[i],b=people[j];
      if(a.chat||b.chat||a.sayT>0||b.sayT>0)continue;
      if(!a.name&&!b.name&&Math.random()<0.6)continue;
      const key=a.name+b.name+i+'-'+j;
      if((cooldown.get(key)||0)>now)continue;
      if(Math.hypot(a.x-b.x,(a.y-b.y)*1.6)<24)startChat(a,b);
    }
  }
}

function drawPerson(p){
  const x=Math.round(p.x),y=Math.round(p.y),left=x-6,top=y-17;
  ctx.globalAlpha=0.25;px(ctx,x-5,y,10,1,'#000');px(ctx,x-4,y+1,8,1,'#000');ctx.globalAlpha=1;
  const frame=p.state==='walk'&&Math.floor(p.anim*6)%2===1?1:0;
  const rows=p.rows.concat(LEGS[frame]);
  rows.forEach((row,j)=>{for(let i=0;i<12;i++){const ch=row[i];const col=p.pal[ch];if(!col)continue;const ix=p.flip?11-i:i;px(ctx,left+ix,top+j,1,1,col)}});
  if(!bday.length)return;
  if(bday.includes(p.name)){
    px(ctx,x-3,top-1,6,1,'#e84a8a');px(ctx,x-2,top-2,4,1,'#f6d34a');px(ctx,x-2,top-3,4,1,'#e84a8a');px(ctx,x-1,top-4,2,1,'#4ab0e8');px(ctx,x-1,top-5,2,1,'#ffffff');
  }else{
    const cols=['#e84a8a','#4ab0e8','#f6d34a','#7bd36a','#a98be0'];const c=cols[people.indexOf(p)%cols.length];
    const hx=p.flip?x-7:x+6;
    px(ctx,hx,y-26,1,20,'#e6e6e6');px(ctx,hx-2,y-31,5,4,c);px(ctx,hx-1,y-32,3,6,c);px(ctx,hx-1,y-31,1,1,'#ffffff');
  }
}
function drawTag(p){
  const fs=Math.max(7,2.6*u);ctx.font=`${fs}px "Press Start 2P", monospace`;ctx.textAlign='center';ctx.textBaseline='top';
  const label=p.name||'?';const X=p.x*u,Y=(p.y+3)*u;
  ctx.fillStyle='#1d3320';ctx.fillText(label,X+Math.max(1,u*0.4),Y+Math.max(1,u*0.4));
  ctx.fillStyle='#fffbe8';ctx.fillText(label,X,Y);
}
function drawBubble(p){
  if(!p.say)return;
  const fs=Math.max(8,3.2*u);ctx.font=`${fs}px "Press Start 2P", monospace`;ctx.textAlign='left';ctx.textBaseline='top';
  const pad=fs*0.6,bd=Math.max(2,Math.round(u*0.5));
  const tw=ctx.measureText(p.say).width,bw=tw+pad*2,bh=fs+pad*2,tail=fs*0.6;
  const cx=p.x*u,by=(p.y-19)*u-bh-tail;
  const bx=Math.max(4,Math.min(W-bw-4,cx-bw/2));
  ctx.fillStyle='#26324a';ctx.fillRect(bx-bd,by-bd,bw+bd*2,bh+bd*2);
  ctx.fillStyle='#ffffff';ctx.fillRect(bx,by,bw,bh);
  const t=Math.max(bd*2,tail*0.8);
  ctx.fillStyle='#26324a';ctx.fillRect(cx-t/2-bd,by+bh,t+bd*2,tail*0.5+bd);ctx.fillRect(cx-t/4-bd,by+bh+tail*0.5,t/2+bd*2,tail*0.5+bd);
  ctx.fillStyle='#ffffff';ctx.fillRect(cx-t/2,by+bh-bd,t,tail*0.5+bd);ctx.fillRect(cx-t/4,by+bh+tail*0.5-bd,t/2,tail*0.5);
  ctx.fillStyle='#222222';ctx.fillText(p.say,bx+pad,by+pad+1);
}

function render(){
  ctx.drawImage(skyLayer,0,0);
  clouds.forEach(drawCloud);
  bats.forEach(drawBat);
  drawSanta();
  ctx.drawImage(landLayer,0,0);
  drawMill();
  const order=[...people].sort((a,b)=>a.y-b.y);
  order.forEach(drawPerson);
  drawParts();
  order.forEach(drawTag);
  order.forEach(drawBubble);
}

/* ---------- sizing ---------- */
function resize(){
  const cssW=screen.clientWidth,cssH=screen.clientHeight,dpr=window.devicePixelRatio||1;
  const scale=cssW<520?3:cssW<900?4:5;
  u=scale*dpr;W=Math.round(cssW*dpr);H=Math.round(cssH*dpr);
  cv.width=W;cv.height=H;
  LW=Math.ceil(cssW/scale);LH=Math.ceil(cssH/scale);
  horizon=Math.round(LH*0.52);
  wx=Math.round(LW*(cssW<520?0.74:0.7));wbase=horizon+5;
  const r=rng(7);
  clouds=Array.from({length:Math.max(3,Math.round(LW/45))},(_,i)=>({x:r()*LW,y:8+r()*(horizon*0.45),w:14+Math.floor(r()*14),s:1.5+r()*2.5}));
  buildLayers();
  initFx();
  if(!people.length)spawn();
  else{const b=walkBox();people.forEach(p=>{p.x=Math.min(b.x1,Math.max(b.x0,p.x));p.y=Math.min(b.y1,Math.max(b.y0,p.y));if(p.state==='walk')newTarget(p)})}
}

/* ---------- tap a person to visit their page ---------- */
const LINKS={Jack:'https://teamjackyeah.com'};
function pageFor(p){return p.name?(LINKS[p.name]||'https://wimbledonmassive.com/'+p.name.toLowerCase()):null}
function go(url){
  if(window.self!==window.top){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
  else location.href=url;
}
function hitTest(e){
  const rect=cv.getBoundingClientRect(),scale=rect.width/LW;
  const lx=(e.clientX-rect.left)/scale,ly=(e.clientY-rect.top)/scale;
  return [...people].sort((a,b)=>b.y-a.y).find(p=>lx>p.x-8&&lx<p.x+8&&ly>p.y-19&&ly<p.y+4);
}
cv.addEventListener('pointermove',e=>{cv.classList.toggle('over',!!hitTest(e))});
cv.addEventListener('click',e=>{
  const hit=hitTest(e);
  if(!hit)return;
  const url=pageFor(hit);
  if(hit.chat){hit.chat.a.say=hit.chat.b.say=null;const c=hit.chat;c.a.chat=c.b.chat=null;c.a.state=c.b.state='idle';c.a.wait=c.b.wait=1}
  hit.state='idle';hit.wait=2;hit.say=hit.name?`Hi, I'm ${hit.name}!`:'Hi!';hit.sayT=2;
  if(url)go(url);
});

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);render();requestAnimationFrame(loop);
}
new ResizeObserver(()=>{resize();render()}).observe(screen);
window.addEventListener('hashchange',()=>{pickTheme();buildLayers();initFx();render()});
resize();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{render();requestAnimationFrame(loop)});
})();
</script>
