<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Lauren's Corner Shop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: a pixel shopfront (striped awning, Lauren and Milo behind the counter), shelves of her favourite things below, and a basket that rings up at the till. Single warm evening look in the same pixel world as the Common. */
:root{
  --street:#2b2238;
  --wall:#f3e3c3;
  --shelf:#8a5a34;
  --shelf-dark:#5e3b20;
  --ink:#2a1d14;
  --paper:#fffaf0;
  --pink:#f08cb4;
  --green:#3f8a55;
  --gold:#f6c945;
  --muted:#7a6a5a;
  --pixel:"Press Start 2P","Courier New",monospace;
  color-scheme:light;
}
html,body{min-height:100%}
body{margin:0;background:var(--street);color:var(--ink);font-family:var(--pixel);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 40px}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:18px}
.back{color:#c9bfe0;font-size:10px;text-decoration:none}
.back:hover,.back:focus-visible{color:#fff}

.front{background:var(--wall);border:4px solid #000;box-shadow:6px 6px 0 #000;overflow:hidden}
.awning{height:34px;background:repeating-linear-gradient(90deg,var(--green) 0 34px,var(--paper) 34px 68px);border-bottom:4px solid #000;position:relative}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:10px;background:radial-gradient(circle at 17px 0,var(--green) 12px,transparent 13px) 0 0/68px 10px,radial-gradient(circle at 51px 0,var(--paper) 12px,transparent 13px) 0 0/68px 10px}
.sign{margin:22px 16px 0;text-align:center}
.sign h1{margin:0;display:inline-block;background:var(--ink);color:var(--gold);font-weight:400;font-size:clamp(14px,3.6vw,28px);line-height:1.5;padding:12px 18px;border:4px solid var(--gold);box-shadow:0 0 0 4px var(--ink);text-wrap:balance}
.sign p{margin:12px 0 0;font-size:9px;color:var(--muted);letter-spacing:.08em}
#counter{display:block;width:100%;height:auto;image-rendering:pixelated;margin-top:6px}

.shop{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
@media (max-width:820px){.shop{grid-template-columns:1fr}}
.shelves{background:var(--wall);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:14px;display:grid;gap:10px}
.shelves h2,.basket h2{margin:0;font-size:11px;font-weight:400;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{font-family:var(--pixel);background:var(--paper);border:3px solid var(--ink);border-bottom-width:8px;border-bottom-color:var(--shelf);
  padding:10px 6px 8px;display:grid;justify-items:center;gap:6px;cursor:pointer;color:var(--ink);min-width:0}
.item:hover{background:#fff;transform:translateY(-2px)}
.item:active{transform:translateY(1px)}
.item:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.item canvas{width:48px;height:48px;image-rendering:pixelated}
.item .nm{font-size:8px;line-height:1.6;text-align:center;min-height:2.6em;display:flex;align-items:center}
.item .pr{font-size:9px;color:var(--green)}
.item.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.08)}}

.basket{background:var(--paper);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:14px;display:grid;gap:10px;position:sticky;top:max(12px, env(safe-area-inset-top, 0px))}
.lines{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:8px;line-height:1.6;max-height:240px;overflow:auto}
.lines li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.lines button{font-family:var(--pixel);font-size:8px;border:2px solid var(--ink);background:#fff;cursor:pointer;padding:2px 5px}
.empty{font-size:8px;color:var(--muted);line-height:1.8;margin:0}
.total{display:flex;justify-content:space-between;font-size:11px;border-top:3px dashed var(--ink);padding-top:10px}
.pay{font-family:var(--pixel);font-size:12px;background:var(--gold);border:4px solid #000;box-shadow:4px 4px 0 #000;padding:12px;cursor:pointer;color:var(--ink)}
.pay:disabled{opacity:.45;cursor:not-allowed}
.pay:not(:disabled):active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.pay:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

.receipt[hidden],.empty[hidden]{display:none}
.receipt{position:fixed;inset:0;background:rgba(20,14,30,.7);display:grid;place-items:center;padding:16px;z-index:5}
.slip{background:#fff;width:min(320px,100%);padding:18px 16px;font-size:8px;line-height:1.9;display:grid;gap:8px;box-shadow:6px 6px 0 #000;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 8px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 8px repeat-x}
.slip h3{margin:0;text-align:center;font-size:10px;font-weight:400}
.slip .row{display:flex;justify-content:space-between;gap:8px}
.slip .thanks{text-align:center;color:var(--muted)}
.slip button{font-family:var(--pixel);font-size:9px;border:3px solid var(--ink);background:var(--gold);padding:8px;cursor:pointer;justify-self:center}
@media (prefers-reduced-motion: reduce){.item,.item.bump{animation:none;transform:none}}
</style>

<div class="wrap">
  <a class="back" href="../">← Back to the Common</a>

  <section class="front" aria-label="Shopfront">
    <div class="awning" aria-hidden="true"></div>
    <div class="sign">
      <h1>Lauren's Corner Shop</h1>
      <p>OPEN ALL HOURS · WIMBLEDON SW19</p>
    </div>
    <canvas id="counter" aria-label="Lauren behind the counter with Milo the dog"></canvas>
  </section>

  <div class="shop">
    <section class="shelves" aria-labelledby="shelfTitle">
      <h2 id="shelfTitle">TAP TO ADD TO YOUR BASKET</h2>
      <div class="grid" id="grid"></div>
    </section>
    <aside class="basket" aria-labelledby="basketTitle">
      <h2 id="basketTitle">YOUR BASKET</h2>
      <p class="empty" id="empty">Nothing in here yet. Grab a bagel.</p>
      <ul class="lines" id="lines"></ul>
      <div class="total"><span>TOTAL</span><span id="total">£0.00</span></div>
      <button class="pay" id="pay" type="button" disabled>PAY AT THE TILL</button>
    </aside>
  </div>
</div>

<div class="receipt" id="receipt" hidden>
  <div class="slip" role="dialog" aria-modal="true" aria-labelledby="rTitle">
    <h3 id="rTitle">LAUREN'S CORNER SHOP</h3>
    <div id="rLines"></div>
    <div class="row" style="border-top:2px dashed #000;padding-top:6px"><b>TOTAL</b><b id="rTotal"></b></div>
    <p class="thanks" id="rThanks"></p>
    <button type="button" id="rClose">SHOP AGAIN</button>
  </div>
</div>

<script>
(function(){
// ---------- stock: Lauren's favourite things ----------
const STOCK=[
 {id:'choc',name:'Chocolate bar',p:85,pal:{P:'#6b2f8f',p:'#8e4ab5',G:'#e6c04a',B:'#5a3420',W:'#fff'},rows:[
  "............","............",".PPPPPPPPPP.",".PWWPPPPPPP.",".PPPPPPPPPP.",".GGGGGGBBBB.",".GGGGGGBpBB.",".PPPPPPPPPP.","............"]},
 {id:'bisc',name:'Biscuits',p:120,pal:{B:'#d9a35a',b:'#a8742f'},rows:[
  "..BBBBBBBB..",".BbBBbBBbBB.","..BBBBBBBB..","............","..BBBBBBBB..",".BbBBbBBbBB.","..BBBBBBBB..","............","..BBBBBBBB..",".BbBBbBBbBB.","..BBBBBBBB.."]},
 {id:'tea',name:'Tea',p:250,pal:{W:'#ffffff',K:'#2a1d14',T:'#9a5a2a',S:'#c9c9c9',Y:'#f6c945'},rows:[
  ".......S....","..KKKKKKSK..",".KWWWWWWWSK.",".KTTTTTTTKYK","KWWWWWWWWKKK","KWWWWWWWWK.K","KWWWWWWWWKKK",".KWWWWWWK...","..KKKKKK...."]},
 {id:'coffee',name:'Coffee',p:310,pal:{K:'#2a1d14',B:'#4a2c1a',b:'#7a4a2a',W:'#fff'},rows:[
  "..KKKKKKKK..",".KBBBBBBBBK.",".KBBBBBBBBK.",".KBWWWWWWBK.",".KBWbbbbWBK.",".KBWbbbbWBK.",".KBWWWWWWBK.",".KBBBBBBBBK.","..KKKKKKKK.."]},
 {id:'oat',name:'Oat milk',p:180,pal:{K:'#2a1d14',W:'#fff',B:'#4ab0e8',Y:'#e6c04a'},rows:[
  "....KKKK....","....KBBK....","...KWWWWK...","..KWWWWWWK..","..KBBBBBBK..","..KWYYYYWK..","..KWYYYYWK..","..KWWWWWWK..","..KBBBBBBK..","..KKKKKKKK.."]},
 {id:'book',name:'Book',p:899,pal:{K:'#2a1d14',R:'#c0453a',W:'#fff3dc',G:'#e6c04a'},rows:[
  "..KKKKKKKK..",".KRRRRRRRWK.",".KRGGGGGRWK.",".KRRRRRRRWK.",".KRRGGGRRWK.",".KRRRRRRRWK.",".KRRRRRRRWK.",".KRRRRRRRWK.","..KKKKKKKK.."]},
 {id:'crisps',name:'Salt & vinegar crisps',p:95,pal:{K:'#2a1d14',G:'#3fae5a',g:'#2a7a3d',W:'#fff',Y:'#f6c945'},rows:[
  "..KKKKKKKK..",".KgGGGGGGgK.",".KGGGGGGGGK.",".KGWWWWWWGK.",".KGWYYYYWGK.",".KGWWWWWWGK.",".KGGGGGGGGK.",".KgGGGGGGgK.","..KKKKKKKK.."]},
 {id:'cd',name:'Taylor Swift CD',p:1299,pal:{K:'#2a1d14',S:'#c9d4e8',s:'#9fb0cf',P:'#f08cb4',W:'#fff'},rows:[
  "...KKKKKK...","..KSSSSSSK..",".KSSPPPPSSK.",".KSPWWWWPSK.",".KSPWKKWPsK.",".KSPWKKWPsK.",".KSPWWWWPsK.",".KSSPPPPssK.","..KssssssK..","...KKKKKK..."]},
 {id:'saus',name:'Veggie sausages',p:275,pal:{K:'#2a1d14',S:'#c97a4a',s:'#a35a32',W:'#fff'},rows:[
  "............","..KKKKKKK...",".KSSSSSSSK..",".KSWSSSSsK..","..KKKKKKKK..","...KSSSSSSSK","...KSWSSSSsK","....KKKKKKK.","............"]},
 {id:'bagel',name:'Bagels',p:160,pal:{K:'#2a1d14',B:'#d9a35a',b:'#a8742f',W:'#fff3dc'},rows:[
  "...KKKKKK...","..KBBBBBBK..",".KBbBBBBbBK.",".KBBKKKKBBK.",".KBBK..KBBK.",".KBBKKKKBBK.",".KBbBBBBbBK.","..KBBBBBBK..","...KKKKKK..."]},
 {id:'flowers',name:'Flowers',p:550,pal:{P:'#f08cb4',Y:'#f6c945',R:'#e8504a',G:'#3f8a55',W:'#fff'},rows:[
  ".PP...YY....","PYPP.YRRY.P.",".PP...YY.PYP","..G...G...P.","..G..G...G..","...G.G..G...","....GGGG....","...WWWWWW...","....WWWW...."]},
 {id:'plant',name:'Houseplant',p:700,pal:{G:'#3f8a55',g:'#2a6a3d',T:'#c97a4a',t:'#a35a32'},rows:[
  ".G......G...","GgG..G.GgG..",".GgG.GGgG...","..GgGgGG....","....Gg......","..TTTTTTTT..","..tTTTTTTt..","...TTTTTT...","...tttttt..."]}
];
const money=p=>'£'+(p/100).toFixed(2);

// ---------- sound (starts after the first tap) ----------
let actx=null;
function beep(f,d,type,v,delay){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime+(delay||0);const o=actx.createOscillator(),g=actx.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.08,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.05)}catch(e){}}
const blip=()=>{beep(880,0.08);beep(1320,0.1,'square',0.06,0.07)};
const kaching=()=>{beep(1568,0.12,'square',0.08);beep(2093,0.25,'square',0.08,0.1);beep(2637,0.4,'triangle',0.06,0.2)};

// ---------- shelves ----------
const grid=document.getElementById('grid');
function drawIcon(cv,item){
  const rows=item.rows,h=rows.length,w=rows[0].length,S=4;
  cv.width=48;cv.height=48;const c=cv.getContext('2d');
  const ox=Math.floor((12-w)/2),oy=Math.floor((12-h)/2);
  rows.forEach((r,j)=>{for(let i=0;i<w;i++){const col=item.pal[r[i]];if(!col)continue;c.fillStyle=col;c.fillRect((ox+i)*S,(oy+j)*S,S,S)}});
}
const basket=new Map();
STOCK.forEach(item=>{
  const b=document.createElement('button');b.type='button';b.className='item';b.setAttribute('aria-label',`Add ${item.name}, ${money(item.p)}`);
  const cv=document.createElement('canvas');drawIcon(cv,item);
  const nm=document.createElement('span');nm.className='nm';nm.textContent=item.name;
  const pr=document.createElement('span');pr.className='pr';pr.textContent=money(item.p);
  b.append(cv,nm,pr);
  b.addEventListener('click',()=>{basket.set(item.id,(basket.get(item.id)||0)+1);b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');blip();render();say(item)});
  grid.appendChild(b);
});

// ---------- basket ----------
const lines=document.getElementById('lines'),empty=document.getElementById('empty'),totalEl=document.getElementById('total'),pay=document.getElementById('pay');
const byId=id=>STOCK.find(s=>s.id===id);
function total(){let t=0;basket.forEach((q,id)=>t+=q*byId(id).p);return t}
function render(){
  lines.innerHTML='';
  basket.forEach((q,id)=>{
    const it=byId(id);const li=document.createElement('li');
    const n=document.createElement('span');n.textContent=`${q} × ${it.name}`;
    const pr=document.createElement('span');pr.textContent=money(q*it.p);
    const rm=document.createElement('button');rm.type='button';rm.textContent='−';rm.setAttribute('aria-label',`Remove one ${it.name}`);
    rm.addEventListener('click',()=>{const v=basket.get(id)-1;if(v<=0)basket.delete(id);else basket.set(id,v);render()});
    li.append(n,pr,rm);lines.appendChild(li);
  });
  empty.hidden=basket.size>0;totalEl.textContent=money(total());pay.disabled=basket.size===0;
}
render();

// ---------- receipt ----------
const receipt=document.getElementById('receipt');
const THANKS=['Thanks for shopping at Lauren\'s! Milo says woof.','Come back soon. Milo will be waiting by the door.','Lovely doing business with you. Mind the step.','Thank you! Your bagels are in safe hands.'];
pay.addEventListener('click',()=>{
  if(!basket.size)return;
  kaching();
  const rl=document.getElementById('rLines');rl.innerHTML='';
  basket.forEach((q,id)=>{const it=byId(id);const d=document.createElement('div');d.className='row';d.innerHTML=`<span></span><span>${money(q*it.p)}</span>`;d.firstChild.textContent=`${q} × ${it.name}`;rl.appendChild(d)});
  document.getElementById('rTotal').textContent=money(total());
  document.getElementById('rThanks').textContent=THANKS[Math.random()*THANKS.length|0];
  receipt.hidden=false;document.getElementById('rClose').focus();
  happy=2.5;
});
document.getElementById('rClose').addEventListener('click',()=>{basket.clear();render();receipt.hidden=true;pay.focus()});
receipt.addEventListener('click',e=>{if(e.target===receipt)document.getElementById('rClose').click()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!receipt.hidden)document.getElementById('rClose').click()});

// ---------- the counter: Lauren and Milo ----------
const LAUREN=["..KKKKKKKK..",".KHHHHHHHHK.","KHHHhHHHHHHK","KHHSSSSSSHHK","KHSSSSSSSSHK","KHSKSSSSKSHK","KHSSSSSSSSHK","KHSSSWWSSSHK","KHHKSSSSKHHK","KHHTLTTMTHHK","KHHTTMTTLHHK","KSHTLTTTTHSK","KSKTTMTLTKSK"];
const LPAL={K:'#151515',W:'#ffffff',H:'#2a1a14',h:'#43291d',S:'#ecbd9c',T:'#201c33',L:'#f08cb4',M:'#f6c945'};
const MILO=[".......BBB.","......BBbBB","......BeBBB","BB....BBBBN","BbBBBBbBBTT",".BbBGGBBB..",".BBBBBBBB..",".BB.B..BB.."];
const MPAL={B:'#141414',b:'#3a3a3a',e:'#6a6a6a',N:'#000000',T:'#f08cb4',G:'#6b6f78'};
const cv=document.getElementById('counter'),ctx=cv.getContext('2d');
let LW=160,LH=40,U=4,bubble=null,bubbleT=0,happy=0,wag=0;
function say(item){
  const lines={choc:'Good choice!',bisc:'Kettle\'s on!',tea:'Milk, no sugar?',coffee:'Oat milk with that?',oat:'The only milk.',book:'Ooh, I loved that one.',crisps:'The best flavour.',cd:'A classic!',saus:'Sizzle sizzle.',bagel:'Fresh this morning!',flowers:'Gorgeous, aren\'t they?',plant:'Water it on Sundays.'};
  bubble=lines[item.id]||'Lovely!';bubbleT=2.2;wag=1.2;
}
function size(){
  const w=cv.parentElement.clientWidth;U=w<520?3:4;LW=Math.ceil(w/U);LH=44;
  cv.width=LW*U;cv.height=LH*U;
}
new ResizeObserver(size).observe(cv.parentElement);size();
const px=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x)*U,Math.round(y)*U,Math.ceil(w)*U,Math.ceil(h)*U)};
function sprite(rows,pal,x,y,flip){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const c=pal[r[i]];if(!c)continue;px(x+(flip?r.length-1-i:i),y+j,1,1,c)}})}
function draw(t){
  // back wall shelves with tiny stock
  px(0,0,LW,LH,'#f3e3c3');
  for(let s=0;s<2;s++){const y=6+s*10;px(0,y+6,LW,2,'#8a5a34');for(let x=3;x<LW-3;x+=5){const cols=['#6b2f8f','#3fae5a','#c0453a','#4ab0e8','#f6c945','#f08cb4'];px(x,y+((x*7)%3),3,6-((x*7)%3),cols[(x+s*3)%cols.length])}}
  // counter
  const cx=Math.round(LW/2);
  px(0,LH-12,LW,12,'#8a5a34');px(0,LH-12,LW,2,'#a8743f');px(0,LH-3,LW,3,'#5e3b20');
  // till
  px(cx+16,LH-20,12,8,'#3a3a46');px(cx+17,LH-19,10,3,'#7bd36a');px(cx+18,LH-15,8,2,'#c9c9c9');
  // Lauren behind the counter (top half shows)
  const bob=happy>0?Math.round(Math.abs(Math.sin(t*12))*1):0;
  sprite(LAUREN,LPAL,cx-6,LH-25-bob,false);
  px(0,LH-12,LW,12,'#8a5a34');px(0,LH-12,LW,2,'#a8743f');px(0,LH-3,LW,3,'#5e3b20');
  px(cx+16,LH-20,12,8,'#3a3a46');px(cx+17,LH-19,10,3,'#7bd36a');px(cx+18,LH-15,8,2,'#c9c9c9');
  // Milo on the counter end
  const mx=cx-26,my=LH-19-(wag>0&&Math.sin(t*20)>0?1:0);
  sprite(MILO,MPAL,mx,my,false);
  if(wag>0)px(mx-1,my+3+(Math.sin(t*30)>0?0:1),1,1,'#141414');
  // speech bubble
  if(bubble&&bubbleT>0){
    const fs=Math.max(8,U*2.4);ctx.font=`${fs}px "Press Start 2P", monospace`;ctx.textBaseline='top';
    const tw=ctx.measureText(bubble).width,pad=fs*0.6,bw=tw+pad*2,bh=fs+pad*2;
    let bx=(cx+8)*U,by=(LH-36)*U;bx=Math.min(bx,cv.width-bw-6);
    ctx.fillStyle='#2a1d14';ctx.fillRect(bx-3,by-3,bw+6,bh+6);ctx.fillStyle='#fff';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#2a1d14';ctx.fillText(bubble,bx+pad,by+pad+1);
  }
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;bubbleT-=dt;happy-=dt;wag-=dt;draw(now/1000);requestAnimationFrame(loop)}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{bubble='Welcome in!';bubbleT=3;requestAnimationFrame(loop)});
})();
</script>

</body>
</html>
