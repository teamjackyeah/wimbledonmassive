<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wimbledon Massive Cryptic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#1f2b38;--panel:#fbf8f1;--ink:#1d1d24;--muted:#6a6670;--hi:#ffe08a;--word:#d6e8fa;--bad:#c0392b;--pixel:"Press Start 2P","Courier New",monospace;--clue:Georgia,"Times New Roman",serif;color-scheme:light}
*{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--pixel);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.back{color:#c5cfe6;font-size:9px;text-decoration:none}
.back:hover,.back:focus-visible{color:#fff}
.box{background:var(--panel);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:14px}
.sign{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.sign canvas{width:48px;height:68px;image-rendering:pixelated}
h1{margin:0;font-weight:400;font-size:clamp(12px,3.2vw,20px);line-height:1.5}
.sub{margin:6px 0 0;font-family:var(--clue);font-size:15px;line-height:1.5;color:var(--muted)}
.play{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:20px;align-items:start}
@media (max-width:760px){.play{grid-template-columns:1fr}}
.cur{font-family:var(--clue);font-size:16px;line-height:1.45;background:var(--word);border:3px solid #000;padding:10px 12px;margin-bottom:10px;min-height:2.9em}
.cur b{font-family:var(--pixel);font-size:10px;font-weight:400;margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(11,1fr);border:3px solid #000;background:#000;gap:1px;aspect-ratio:1;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.cell{position:relative;background:#fff;display:grid;place-items:center;font-family:var(--clue);font-size:clamp(14px,4.2vw,22px);text-transform:uppercase;cursor:pointer}
.cell.blk{background:#000;cursor:default}
.cell .n{position:absolute;top:1px;left:2px;font-family:var(--clue);font-size:clamp(7px,1.8vw,10px);line-height:1}
.cell.word{background:var(--word)}
.cell.on{background:var(--hi)}
.cell.bad{color:var(--bad);text-decoration:line-through}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font-family:var(--pixel);font-size:9px;background:#fff;color:var(--ink);border:3px solid #000;box-shadow:3px 3px 0 #000;padding:9px 10px;cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn:focus-visible{outline:3px solid #3a6cb8;outline-offset:2px}
.msg{font-size:9px;line-height:1.9;margin:10px 0 0;min-height:1.9em}
.clues h2{font-weight:400;font-size:10px;margin:0 0 8px}
.clues ol{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:2px}
.clues li{font-family:var(--clue);font-size:15px;line-height:1.45;padding:5px 6px;cursor:pointer;border-radius:2px}
.clues li b{display:inline-block;min-width:1.8em;font-weight:700}
.clues li.sel{background:var(--word)}
.clues li.done{color:#8a8690}
.clues li.done::after{content:" \2713";color:#2f7d4a}
#kb{position:fixed;left:-100px;top:0;width:40px;height:30px;opacity:0;font-size:16px;border:0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&lt; Back to Wimbledon Common</a>
  <header class="box sign">
    <canvas id="me" width="12" height="17" aria-label="Fred, the setter"></canvas>
    <div>
      <h1>Wimbledon Massive Cryptic #1</h1>
      <p class="sub">Fred made this, not AI. Blame him.</p>
    </div>
  </header>
  <section class="box play">
    <div>
      <div class="cur" id="cur" aria-live="polite">Tap a square to start.</div>
      <div class="grid" id="grid" role="grid" aria-label="Crossword grid"></div>
      <div class="tools">
        <button class="btn" id="check" type="button">CHECK</button>
        <button class="btn" id="clearW" type="button">CLEAR WORD</button>
        <button class="btn" id="clearA" type="button">CLEAR ALL</button>
      </div>
      <p class="msg" id="msg" aria-live="polite"></p>
    </div>
    <div class="clues">
      <h2>ACROSS</h2><ol id="across"></ol>
      <h2>DOWN</h2><ol id="down"></ol>
    </div>
  </section>
</div>
<input id="kb" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Type answer">
<script>
(function(){
// Fred
const ME=["...KKKKKK...","..KHHHHhHK..",".KHHhHHHHHK.",".KHSSSSSSHK.",".KKKKSSKKKK.",".KLEKSSKELK.",".KBSSSSSSBK.",".KBBSWWSBBK.","..KKBBBBKK..",".KTTTTTTTTK.","KTTTTTTTTTTK","KSTTTTTTTTSK","KSKTTTTTTKSK","..KPPPPPPK..","..KPPKKPPK..","..KPPKKPPK..","..KOOKKOOK.."];
const MP={K:'#151515',W:'#ffffff',H:'#8a6040',h:'#6a4628',S:'#f0c4a4',L:'#dfe8ee',E:'#2a2a34',B:'#c8946a',T:'#d8695e',P:'#d8c4a0',O:'#5a4a3a'};
const mc=document.getElementById('me').getContext('2d');ME.forEach((r,j)=>{for(let i=0;i<12;i++){const c=MP[r[i]];if(c){mc.fillStyle=c;mc.fillRect(i,j,1,1)}}});

const SOL=[
"#WIMBLEDON#",
"J#R#O#X#W#M",
"ELOIN#AILSA",
"N#N#N#M###R",
"N#MAIL#EPIC",
"E#A#EON#E#U",
"WONG#LUNA#S",
"T###G#R#R#L",
"OUTER#SUSHI",
"N#I#E#E#O#M",
"#FERGUSONS#"];
// Fred's clues, keyed by grid number
const CLUES={
 a:{1:'Place where Henman suffered during swim – bled O-negative (9).',
    8:'After mix up, Elise Aston misses lobster starter and messily eats very old take away (5).',
    9:'Alas, I muddled up Thames Water employee and new mother (5).',
    10:'What Gabor’s ancestors delivered regularly, returning in Lei’s arms (4).',
    12:'Engineering Change containing 3.14159….impressive! (4)',
    14:'Nothing inside the letters that Ben and Ken share for a long time (3).',
    16:'Annie and Long, perhaps, separating right from wrong (4).',
    17:'When lacking Religious Education, Lauren is confused for a Roman goddess (4).',
    19:'External communication device cuts off Rowan initially (5).',
    21:'Classic Wimbledon Massive honeymoon food gives us hiccups internally (5).',
    22:'Drunk surgeons following primarily Fred, Jenny and James (9).'},
 d:{2:'JARVIS worked very hard for this (4,3).',
    3:'Ben? No, I switched for Clyde’s partner (6).',
    4:'Max doing a flip next to Emily’s head - this is causing Shaun stress (4).',
    5:'Waino vacated and returned before first light - a nocturnal creature (3).',
    6:'Bruce, perhaps, snubbed wife to finally spoon a woman from Banbury (3,6).',
    7:'A player in a church band and a Roman Catholic interrupting follower of Islam (6,3).',
    11:'Repeatedly saying Jessie’s surname, maybe? (1,1,1).',
    13:'Individual hugging Ciara at last, and Rachel (7).',
    15:'Slack runs, and starts to easily sprint past Jack’s colleagues (6).',
    18:'Congregation surrounds James, for example (4).',
    20:'Twilight Imperium finally done – it’s a draw! (3).'}
};
const N=11,blk=(r,c)=>r<0||c<0||r>=N||c>=N||SOL[r][c]==='#';
// number the grid and build words
const num=[],words={a:[],d:[]};let k=0;
for(let r=0;r<N;r++){num[r]=[];for(let c=0;c<N;c++){num[r][c]=0;if(blk(r,c))continue;
  const sa=blk(r,c-1)&&!blk(r,c+1),sd=blk(r-1,c)&&!blk(r+1,c);
  if(sa||sd){k++;num[r][c]=k;
    if(sa){const cells=[];for(let x=c;!blk(r,x);x++)cells.push([r,x]);words.a.push({n:k,cells})}
    if(sd){const cells=[];for(let y=r;!blk(y,c);y++)cells.push([y,c]);words.d.push({n:k,cells})}}}}
const STORE='fred-cryptic-1';
let fill=Array.from({length:N},()=>Array(N).fill(''));
try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s&&s.length===N)fill=s}catch(e){}
const gridEl=document.getElementById('grid'),cells=[];
for(let r=0;r<N;r++){cells[r]=[];for(let c=0;c<N;c++){const d=document.createElement('div');d.className='cell'+(blk(r,c)?' blk':'');
  if(!blk(r,c)){if(num[r][c]){const s=document.createElement('span');s.className='n';s.textContent=num[r][c];d.appendChild(s)}
    const t=document.createElement('span');t.className='t';d.appendChild(t);d.addEventListener('pointerdown',e=>{e.preventDefault();tap(r,c)})}
  gridEl.appendChild(d);cells[r][c]=d}}
function clueList(dir,el){words[dir].forEach(w=>{const li=document.createElement('li');li.innerHTML=`<b>${w.n}</b>`;li.appendChild(document.createTextNode(CLUES[dir][w.n]||''));
  li.onclick=()=>{sel={dir,w};pos=firstEmpty(w);render();focusKb()};w.li=li;el.appendChild(li)})}
clueList('a',document.getElementById('across'));clueList('d',document.getElementById('down'));
let sel=null,pos=0;
const kb=document.getElementById('kb');
function focusKb(){try{kb.focus({preventScroll:true})}catch(e){kb.focus()}}
function wordAt(r,c,dir){return words[dir].find(w=>w.cells.some(([y,x])=>y===r&&x===c))}
function tap(r,c){
  const cur=sel&&sel.w.cells[pos];
  if(cur&&cur[0]===r&&cur[1]===c){const other=sel.dir==='a'?'d':'a',w=wordAt(r,c,other);if(w){sel={dir:other,w}}}
  else{let w=sel&&wordAt(r,c,sel.dir);let dir=sel?sel.dir:'a';if(!w){dir=dir==='a'?'d':'a';w=wordAt(r,c,dir)}sel={dir,w}}
  pos=sel.w.cells.findIndex(([y,x])=>y===r&&x===c);render();focusKb()}
function firstEmpty(w){const i=w.cells.findIndex(([y,x])=>!fill[y][x]);return i<0?0:i}
function save(){try{localStorage.setItem(STORE,JSON.stringify(fill))}catch(e){}}
function solved(w){return w.cells.every(([y,x])=>fill[y][x]===SOL[y][x])}
function render(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(blk(r,c))continue;const d=cells[r][c];d.querySelector('.t').textContent=fill[r][c];d.classList.remove('word','on')}
  ['a','d'].forEach(dir=>words[dir].forEach(w=>{w.li.classList.toggle('sel',!!sel&&sel.w===w);w.li.classList.toggle('done',solved(w))}));
  if(sel){sel.w.cells.forEach(([y,x])=>cells[y][x].classList.add('word'));const [y,x]=sel.w.cells[pos];cells[y][x].classList.add('on');
    document.getElementById('cur').innerHTML=`<b>${sel.w.n} ${sel.dir==='a'?'ACROSS':'DOWN'}</b>`;document.getElementById('cur').appendChild(document.createTextNode(CLUES[sel.dir][sel.w.n]));}
  const all=SOL.every((row,r)=>[...row].every((ch,c)=>ch==='#'||fill[r][c]===ch));
  if(all)document.getElementById('msg').textContent='Solved! Every answer is right. Fred is impressed (probably).';
}
function type(ch){if(!sel)return;const [y,x]=sel.w.cells[pos];fill[y][x]=ch;cells[y][x].classList.remove('bad');if(pos<sel.w.cells.length-1)pos++;save();render()}
function back(){if(!sel)return;const [y,x]=sel.w.cells[pos];if(fill[y][x]){fill[y][x]=''}else if(pos>0){pos--;const [y2,x2]=sel.w.cells[pos];fill[y2][x2]=''}save();render()}
function move(dr,dc){if(!sel)return;let [y,x]=sel.w.cells[pos];y+=dr;x+=dc;while(!(y<0||x<0||y>=N||x>=N)&&blk(y,x)){y+=dr;x+=dc}if(y<0||x<0||y>=N||x>=N)return;
  const dir=dr?'d':'a';const w=wordAt(y,x,dir)||wordAt(y,x,dir==='a'?'d':'a');sel={dir:w===wordAt(y,x,dir)?dir:(dir==='a'?'d':'a'),w};pos=w.cells.findIndex(([a,b])=>a===y&&b===x);render()}
kb.addEventListener('input',()=>{const v=kb.value.replace(/[^a-z]/gi,'').toUpperCase();for(const ch of v)type(ch);kb.value=''});
kb.addEventListener('keydown',e=>{
  if(e.key==='Backspace'){e.preventDefault();back()}
  else if(e.key==='ArrowRight')move(0,1);else if(e.key==='ArrowLeft')move(0,-1);else if(e.key==='ArrowDown')move(1,0);else if(e.key==='ArrowUp')move(-1,0);
  else if(e.key==='Tab'){e.preventDefault();nextWord(e.shiftKey?-1:1)}
  else if(/^[a-z]$/i.test(e.key)&&!e.ctrlKey&&!e.metaKey){e.preventDefault();type(e.key.toUpperCase())}});
function nextWord(step){const list=[...words.a.map(w=>({dir:'a',w})),...words.d.map(w=>({dir:'d',w}))];let i=sel?list.findIndex(x=>x.w===sel.w):-1;i=(i+step+list.length)%list.length;sel=list[i];pos=firstEmpty(sel.w);render()}
document.getElementById('check').onclick=()=>{let wrong=0,blank=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(blk(r,c))continue;const bad=fill[r][c]&&fill[r][c]!==SOL[r][c];cells[r][c].classList.toggle('bad',!!bad);if(bad)wrong++;if(!fill[r][c])blank++}
  const m=document.getElementById('msg');
  if(!wrong&&!blank)m.textContent='Solved! Every answer is right. Fred is impressed (probably).';
  else if(!wrong)m.textContent=`No mistakes so far. ${blank} squares to go.`;
  else m.textContent=`${wrong} letter${wrong===1?'':'s'} not right (crossed out). Have another go.`;
  focusKb()};
document.getElementById('clearW').onclick=()=>{if(!sel)return;sel.w.cells.forEach(([y,x])=>{fill[y][x]='';cells[y][x].classList.remove('bad')});pos=0;save();render();focusKb()};
document.getElementById('clearA').onclick=()=>{fill=Array.from({length:N},()=>Array(N).fill(''));document.querySelectorAll('.cell.bad').forEach(x=>x.classList.remove('bad'));document.getElementById('msg').textContent='';save();render()};
render();
})();
</script>
</body>
</html>
