<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Wimbledon Massive Theme Tune</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: night over Wimbledon Common, mostly sky. Pixel fireworks on a full-screen canvas; title, play button and scrolling lyrics float in the middle. Single dark look, same pixel world as the homepage. */
:root{
  --night:#0a0d24;
  --ink:#fffbe8;
  --muted:#8f93c4;
  --gold:#f6d34a;
  --edge:#26324a;
  --panel:rgba(10,13,36,.55);
  --pixel:"Press Start 2P","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--pixel);overflow:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.stage{
  position:relative;height:100%;box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px;
  display:grid;grid-template-rows:auto 1fr;justify-items:center;
}
.back{justify-self:start;color:var(--muted);font-size:10px;text-decoration:none;padding:8px 0}
.back:hover,.back:focus-visible{color:var(--ink)}
.centre{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:720px;padding-top:4vh}
h1{margin:0;text-align:center;font-weight:400;line-height:1.4;font-size:clamp(18px,4.4vw,40px);letter-spacing:.04em;
  text-shadow:3px 3px 0 var(--edge),-1px -1px 0 var(--edge),1px -1px 0 var(--edge),-1px 1px 0 var(--edge);text-wrap:balance}
.kicker{margin:0;font-size:clamp(9px,1.3vw,12px);color:var(--gold);letter-spacing:.12em}
.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.play{
  font-family:var(--pixel);font-size:clamp(12px,1.8vw,16px);color:#1a1405;background:var(--gold);
  border:4px solid #000;box-shadow:5px 5px 0 #000;padding:14px 22px;cursor:pointer;display:flex;align-items:center;gap:12px;
}
.play:hover{background:#ffe27a}
.play:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #000}
.play:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.play .ico{display:inline-block;width:14px;height:16px;background:#1a1405;clip-path:polygon(0 0,100% 50%,0 100%)}
.play.on .ico{clip-path:polygon(0 0,35% 0,35% 100%,0 100%,0 0,65% 0,100% 0,100% 100%,65% 100%,65% 0)}
.time{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:11ch;text-align:center}
.bar{width:min(420px,100%);height:10px;border:3px solid #000;background:#1a1f45;cursor:pointer;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--gold)}
.lyrics{
  position:relative;width:100%;height:clamp(150px,34vh,300px);overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);
}
.lines{position:absolute;left:0;right:0;top:50%;margin:0;padding:0;list-style:none;text-align:center;transition:transform .7s ease}
.lines li{font-size:clamp(11px,2vw,17px);line-height:1.5;padding:9px 0;color:var(--muted);opacity:.45;transition:color .4s,opacity .4s,transform .4s}
.lines li.tag{font-size:9px;letter-spacing:.14em;color:var(--muted);opacity:.35;padding-top:18px}
.lines li.now{color:var(--gold);opacity:1;transform:scale(1.08);text-shadow:2px 2px 0 #000}
@media (prefers-reduced-motion: reduce){.lines,.lines li{transition:none}}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="stage">
  <a class="back" href="../">← Back to the Common</a>
  <div class="centre">
    <p class="kicker">THE OFFICIAL THEME TUNE</p>
    <h1>Wimbledon Massive</h1>
    <div class="controls">
      <button class="play" id="play" type="button" aria-label="Play the theme tune"><span class="ico" aria-hidden="true"></span><span id="playLabel">PLAY</span></button>
      <span class="time" id="time">0:00 / 2:00</span>
    </div>
    <div class="bar" id="bar" role="slider" aria-label="Song position" aria-valuemin="0" aria-valuemax="120" aria-valuenow="0" tabindex="0"><i></i></div>
    <div class="lyrics" aria-label="Lyrics"><ul class="lines" id="lines"></ul></div>
  </div>
</div>
<audio id="song" src="theme.mp3" preload="auto"></audio>

<script>
(function(){
// Lyrics with the second each line starts (estimated from the track's loudness)
const LYRICS=[
 {tag:'INTRO'},
 {t:4,l:'Welcome to Wimbledon Massive'},{t:11,l:'Welcome to Wimbledon Massive'},
 {tag:'CHORUS'},
 {t:18,l:'Welcome to Wimbledon Massive'},{t:26,l:'Welcome to Wimbledon Massive'},{t:34,l:'Welcome to Wimbledon Massive'},{t:42,l:'Welcome to Wimbledon Massive'},
 {tag:'BUILD'},
 {t:52,l:'Welcome to Wimbledon Massive'},{t:60,l:'Welcome to Wimbledon Massive'},
 {tag:'FINAL CHORUS'},
 {t:68,l:'Welcome to Wimbledon Massive'},{t:75,l:'Welcome to Wimbledon Massive'},{t:82,l:'Welcome to Wimbledon Massive'},{t:89,l:'Welcome to Wimbledon Massive'},{t:96,l:'Welcome to Wimbledon Massive'},{t:103,l:'Welcome to Wimbledon Massive'},
 {tag:'OUTRO'},
 {t:113,l:'Welcome to Wimbledon Massive'}
];
const FINALE=68;   // fireworks go big from here
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

const song=document.getElementById('song'),playBtn=document.getElementById('play'),label=document.getElementById('playLabel');
const timeEl=document.getElementById('time'),bar=document.getElementById('bar'),fill=bar.firstElementChild;
const list=document.getElementById('lines');
const items=LYRICS.map(x=>{const li=document.createElement('li');if(x.tag){li.className='tag';li.textContent=x.tag}else li.textContent=x.l;list.appendChild(li);return li});
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let cur=-1;
function syncLyrics(t){
  let k=-1;LYRICS.forEach((x,i)=>{if(!x.tag&&t>=x.t-0.2)k=i});
  if(k===-1)k=1;
  if(k===cur)return;cur=k;
  items.forEach((li,i)=>li.classList.toggle('now',i===k&&!song.paused||i===k&&song.currentTime>0));
  const li=items[k];list.style.transform=`translateY(${-(li.offsetTop+li.offsetHeight/2)}px)`;
}
function tick(){
  const d=song.duration||120,t=song.currentTime;
  timeEl.textContent=fmt(t)+' / '+fmt(d);fill.style.width=(t/d*100)+'%';bar.setAttribute('aria-valuenow',Math.round(t));
  syncLyrics(t);
}
song.addEventListener('timeupdate',tick);song.addEventListener('loadedmetadata',tick);
song.addEventListener('ended',()=>{setPlaying(false);song.currentTime=0;cur=-1;tick();finale()});
function setPlaying(on){playBtn.classList.toggle('on',on);label.textContent=on?'PAUSE':(song.currentTime>0?'PLAY':'PLAY');playBtn.setAttribute('aria-label',on?'Pause the theme tune':'Play the theme tune');cur=-1;tick()}
playBtn.addEventListener('click',()=>{
  initAudio();
  if(song.paused){song.play().then(()=>setPlaying(true)).catch(()=>{label.textContent='TAP AGAIN'})}
  else{song.pause();setPlaying(false)}
});
function seek(e){const r=bar.getBoundingClientRect();const f=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));song.currentTime=f*(song.duration||120);cur=-1;tick()}
bar.addEventListener('click',seek);
bar.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){song.currentTime+=5;cur=-1;tick()}if(e.key==='ArrowLeft'){song.currentTime-=5;cur=-1;tick()}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();playBtn.click()}});

// ---------- audio analysis for fireworks on the beat ----------
let actx=null,an=null,buf=null,avg=0,lastBoom=0;
function initAudio(){
  if(actx)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;actx=new AC();
    const src=actx.createMediaElementSource(song);an=actx.createAnalyser();an.fftSize=512;
    src.connect(an);an.connect(actx.destination);buf=new Uint8Array(an.frequencyBinCount);
  }catch(e){an=null}
  if(actx&&actx.state==='suspended')actx.resume();
}
function beat(now){
  if(song.paused)return 0;
  const t=song.currentTime,big=t>=FINALE&&t<111;
  if(an){
    an.getByteFrequencyData(buf);
    let e=0;for(let i=1;i<12;i++)e+=buf[i];e/=11;
    avg=avg*0.94+e*0.06;
    // calm pacing: never more than one firework every 1.6 seconds
    const gap=1600;
    if(e>avg*1.12&&e>90&&now-lastBoom>gap){lastBoom=now;return big?2:1}
    if(now-lastBoom>2600){lastBoom=now;return big?2:1}
    return 0;
  }
  // no analyser: steady bursts
  const gap=big?1600:2200;
  if(now-lastBoom>gap){lastBoom=now;return big?2:1}
  return 0;
}

// ---------- pixel night sky ----------
const cv=document.getElementById('sky'),ctx=cv.getContext('2d');
let P=3,w=0,h=0,stars=[],sparks=[],rockets=[],sail=0;
const COLS=[['#ff5d73','#ffb3bf'],['#f6d34a','#fff2a8'],['#4ab0e8','#bfe6ff'],['#7bd36a','#d4f7c8'],['#c58bff','#ead6ff'],['#ff9f43','#ffd9a8']];
function resize(){
  const dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);
  P=(innerWidth<520?3:4)*dpr;w=Math.ceil(cv.width/P);h=Math.ceil(cv.height/P);
  stars=Array.from({length:Math.round(w*h/170)},()=>({x:Math.random()*w|0,y:Math.random()*h*0.8|0,p:Math.random()*6,b:Math.random()<0.15}));
}
addEventListener('resize',resize);resize();
const px=(x,y,ww,hh,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x)*P,Math.round(y)*P,Math.ceil(ww)*P,Math.ceil(hh)*P)};

function launch(power){
  const x=w*(0.1+Math.random()*0.8),ty=h*(0.08+Math.random()*0.35);
  rockets.push({x,y:h*0.86,vy:-(h*0.86-ty)/0.7,ty,c:COLS[Math.random()*COLS.length|0],power});
}
function burst(r){
  const n=r.power>1?46:32,speed=r.power>1?22:16;
  const ring=Math.random()<0.35;
  for(let i=0;i<n;i++){
    const a=Math.PI*2*i/n+Math.random()*0.2,s=speed*(ring?1:0.35+Math.random()*0.65);
    sparks.push({x:r.x,y:r.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:r.c,tw:Math.random()<0.3});
  }
}
function finale(){for(let i=0;i<3;i++)setTimeout(()=>launch(2),i*1000)}

function drawGround(){
  const gy=Math.round(h*0.86);
  px(0,gy,w,h-gy,'#0d1a14');
  for(let x=0;x<w;x+=3)px(x,gy-1-((x*7)%3===0?1:0),2,2,'#0d1a14');
  // tree line
  for(let x=-4;x<w+6;x+=9){const r=4+((x*13)%4);for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(dx*dx+dy*dy<=r*r)px(x+dx,gy-r+dy,1,1,'#0b1611')}
  // windmill silhouette
  const wx=Math.round(w*0.78),base=gy;
  px(wx-10,base-6,20,6,'#151b2e');
  for(let r=0;r<14;r++){const ww=Math.round(9-4*r/13);px(wx-Math.floor(ww/2),base-7-r,ww,1,'#121828')}
  px(wx-3,base-22,6,2,'#1c2338');
  px(wx-5,base-4,1,2,'#f6d34a');px(wx+4,base-4,1,2,'#f6d34a');
  const hx=wx,hy=base-23,L=13;
  for(let k=0;k<4;k++){const a=sail+k*Math.PI/2;for(let t=2;t<=L;t++){px(hx+Math.cos(a)*t,hy+Math.sin(a)*t,1,1,'#2a3352');if(t>4)px(hx+Math.cos(a)*t-Math.sin(a)*2,hy+Math.sin(a)*t+Math.cos(a)*2,1,1,'#222a45')}}
}

let last=performance.now(),idle=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  // sky bands
  const bands=['#070a1e','#0a0d24','#0d112b','#111634','#151a3d','#1b1f47'];
  const bh=Math.ceil(h*0.86/bands.length);
  bands.forEach((c,i)=>px(0,i*bh,w,bh+1,c));
  // stars and moon
  stars.forEach(s=>px(s.x,s.y,1,1,s.b?'#c9cbe0':'#5f6699'));  // steady stars, no twinkle
  const mx=Math.round(w*0.88),my=Math.round(h*0.09);
  for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++)if(dx*dx+dy*dy<=25&&(dx-2)*(dx-2)+(dy+1)*(dy+1)>14)px(mx+dx,my+dy,1,1,'#f4f0d6');

  if(!reduced){
    const b=beat(now);
    if(b)launch(b);
    if(song.paused){idle+=dt;if(idle>2.6){idle=0;launch(1)}}
    sail+=dt*(song.paused?0.3:1.2);
  }
  rockets=rockets.filter(r=>{r.y+=r.vy*dt;px(r.x,r.y,1,2,r.c[1]);px(r.x,r.y+2,1,1,'#ffb36b');if(r.y<=r.ty){burst(r);return false}return true});
  sparks=sparks.filter(s=>{
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=8*dt;s.vx*=0.985;s.vy*=0.985;s.life-=dt*0.4;
    if(s.life<=0)return false;
    ctx.globalAlpha=Math.min(1,s.life*1.4);px(s.x,s.y,1,1,s.c[0]);ctx.globalAlpha=1;  // steady colour that fades, no sparkle flicker
    return true;
  });
  drawGround();
  requestAnimationFrame(loop);
}
if(!reduced){launch(1);setTimeout(()=>launch(1),500)}
requestAnimationFrame(loop);
tick();
})();
</script>

</body>
</html>
